<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar na Vulpus</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<style>
  @font-face{font-family:"Fredoka";src:url("../fonts/Fredoka.ttf") format("truetype");font-weight:300 700;font-display:swap}
  :root{--fundo:#0c0d0f;--cartao:rgba(17,18,20,.78);--borda:rgba(255,255,255,.16);--texto:#f4f1ff;--suave:#b9b4d6;--acento:#8f9cff;--laranja:#f28c38}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:"Fredoka",system-ui,sans-serif;color:var(--texto);
    background:linear-gradient(180deg,rgba(10,11,13,.5),rgba(10,11,13,.8)),var(--fundo) url("../img/fundo.webp") center/cover no-repeat}
  main{width:min(460px,100%);padding:28px 24px;border-radius:20px;background:var(--cartao);border:1px solid var(--borda);backdrop-filter:blur(12px);text-align:center}
  img{width:96px;height:96px;border-radius:50%;object-fit:cover;border:2px solid var(--borda)}
  h1{margin:12px 0 4px;font-size:1.6rem}
  p{margin:6px 0;color:var(--suave)}
  .botao{display:block;margin:18px 0 8px;padding:14px 18px;border-radius:14px;background:var(--laranja);color:#1a0f05;font-weight:600;font-size:1.1rem;text-decoration:none}
  .botao:active{transform:scale(.98)}
  .dados{margin-top:18px;padding:12px;border-radius:12px;background:rgba(255,255,255,.06);text-align:left;font-family:ui-monospace,Consolas,monospace;font-size:.95rem}
  .dados b{color:var(--acento)}
  .trocar{display:inline-block;margin-top:14px;color:var(--acento);font-size:.95rem}
  small{display:block;margin-top:14px;color:var(--suave)}
</style>
</head>
<body>
<main>
  <img src="../img/avatar-kiza.webp" alt="">
  <h1>Entrar na Vulpus</h1>
  <p id="nome">Abrindo o Minecraft…</p>
  <a class="botao" id="abrir" href="#">Abrir no Minecraft</a>
  <div class="dados">
    <div><b>IP:</b> <span id="ip"></span></div>
    <div><b>Porta:</b> <span id="porta"></span></div>
  </div>
  <a class="trocar" id="trocar" href="#"></a>
  <small>Se nada abrir, adicione na mão: Jogar → Servidores → Adicionar servidor. Na primeira vez a tela fica preta com um código; use <b>/minecraft vincular</b> no Discord.</small>
</main>
<script>
  var servidores = {
    principal: { nome: "VULPUS", ip: "plus-01.bedhosting.com.br", porta: 27151, rotulo: "Servidor principal" },
    alt: { nome: "VULPUS-ALT", ip: "vulpus.bedrock.net.br", porta: 27151, rotulo: "Servidor alternativo" }
  };
  var escolha = new URLSearchParams(location.search).get("s") === "alt" ? "alt" : "principal";
  var outro = escolha === "alt" ? "principal" : "alt";
  var s = servidores[escolha];
  var link = "minecraft://?addExternalServer=" + s.nome + "|" + s.ip + ":" + s.porta;
  document.getElementById("abrir").href = link;
  document.getElementById("ip").textContent = s.ip;
  document.getElementById("porta").textContent = s.porta;
  document.getElementById("nome").textContent = s.rotulo;
  var t = document.getElementById("trocar");
  t.textContent = "Usar o " + servidores[outro].rotulo.toLowerCase() + " (" + servidores[outro].ip + ")";
  t.href = outro === "alt" ? "?s=alt" : "?s=principal";
  // tenta abrir sozinho: no celular e no Windows o Minecraft pergunta se quer adicionar o servidor
  setTimeout(function () { location.href = link; }, 500);
</script>
</body>
</html>
